name: Validate and build MyLedger
on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: myledger-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: git diff --exit-code -- lib/data/database.g.dart
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage --reporter expanded
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-coverage
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14
  android:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Allocate memory for Android debug build
        run: |
          echo 'org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError' >> android/gradle.properties
          echo 'org.gradle.workers.max=1' >> android/gradle.properties
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: MyLedger-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
  windows:
    needs: validate
    # Flutter 3.35 selects the correct CMake generator for Visual Studio 2022.
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: MyLedger-windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
